<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>桂圆潘尔赛的日常 · 银行大厅</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 35%, #2c2320 0%, #171210 65%, #0d0a09 100%);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-root canvas {
        border-radius: 10px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #d9c39a;
        font-size: 16px;
        letter-spacing: 2px;
        pointer-events: none;
      }
      #boot-error {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: 70vw;
        color: #ff9aa2;
        font-size: 13px;
        white-space: pre-wrap;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="loading">正在加载银行大厅…</div>
    <div id="boot-error"></div>

    <script>
      // 页面出错时把信息显示出来，方便排查（也方便自动化检查）
      window.addEventListener('error', (e) => {
        const el = document.getElementById('boot-error');
        if (el) el.textContent = `脚本错误：${e.message}`;
        document.title = `ERROR: ${e.message}`;
      });
      window.addEventListener('unhandledrejection', (e) => {
        const el = document.getElementById('boot-error');
        if (el) el.textContent = `未处理的 Promise 错误：${e.reason}`;
        document.title = `ERROR: ${e.reason}`;
      });
    </script>
    <script src="vendor/phaser.min.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
